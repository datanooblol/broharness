[project]
name = "broharness"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "broflow>=0.2.0",
    "brollm>=0.2.0",
    "broskill>=0.1.1",
    "brospec>=0.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
llm = [
    "boto3>=1.43.93",
    "httpx>=0.28.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broharness"]
