[project]
name = "study-on-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bro_agent"]

[dependency-groups]
base = [
    "boto3>=1.34.0",
    "broflow>=0.2.0",
    "brollm>=0.2.0",
]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
default-groups = ["base", "dev"]
